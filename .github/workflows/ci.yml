name: AI Test Platform CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate logs
        run: |
          mkdir -p logs
          python -c "from simulators.system_simulator import generate_logs_fast; open('logs/system.log','w').write(generate_logs_fast())"

      - name: Validate generated test workbook
        run: |
            python -c "from validation.validator import validate_workbook; validate_workbook('generated_tests_interview_ready_50.xlsx')"

      - name: Run tests
        run: |
          pytest tests/ -v